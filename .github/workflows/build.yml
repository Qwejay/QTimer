name: Build and Package QTimer

on:
  # 创建 Release 时自动打包并上传 exe
  release:
    types: [created]

  # 手动触发
  workflow_dispatch:
    inputs:
      version:
        description: ''
        required: true
        default: '1.2'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka ordered-set PyQt5

      - name: Build with Nuitka
        shell: cmd
        run: |
          python -m nuitka ^
            --standalone ^
            --onefile ^
            --windows-console-mode=disable ^
            --enable-plugin=pyqt5 ^
            --include-package=PyQt5 ^
            --windows-icon-from-ico=icon.ico ^
            --product-name="QTimer" ^
            --product-version=${{ github.event.release.tag_name || inputs.version || '1.1.0' }} ^
            --file-description="一款极简风格计时器" ^
            --copyright="QwejayHuang" ^
            --output-dir=dist ^
            --clean-cache=all ^
            --assume-yes-for-downloads ^
            --lto=yes ^
            --remove-output ^
            --disable-dll-dependency-cache ^
            QTimer.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: QTimer-build
          path: dist/QTimer.exe

      - name: Upload exe to Release
        if: github.event_name == 'release'
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/QTimer.exe
          asset_name: QTimer_${{ github.event.release.tag_name }}.exe
          asset_content_type: application/octet-stream
